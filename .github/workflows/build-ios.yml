YAML
name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: |
          npm install
          npx cap init "CreaturesCornhole" "com.creatures.cornhole" --web-dir "www"
          npx cap add ios
          npx cap copy ios
      - run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - uses: actions/upload-artifact@v3
        with:
          name: CreaturesCornhole-iOS-Build
          path: ios/App/build/Release-iphoneos/
