HTML
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creatures Cornhole</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        header { text-align: center; padding: 12px 0; }
        h1 { font-size: 1.75rem; color: var(--primary); font-weight: 800; letter-spacing: 0.5px; }
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; text-align: center; }
        .team-box { display: flex; flex-direction: column; gap: 8px; }
        .team-name { font-size: 1rem; font-weight: 600; color: var(--text-muted); }
        .score-display { font-size: 3.5rem; font-weight: 900; color: var(--text); background: rgba(0,0,0,0.2); border-radius: 12px; padding: 10px 0; }
        .vs { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
        .controls { display: flex; gap: 8px; justify-content: center; }
        button { background-color: var(--primary); color: white; border: none; border-radius: 8px; padding: 10px 16px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:active { transform: scale(0.96); }
        button.btn-sec { background-color: #334155; }
        button.btn-danger { background-color: #ef4444; }
        button.btn-sm { padding: 6px 12px; font-size: 0.85rem; }
        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }
        .history-section { margin-top: 10px; }
        h2 { font-size: 1.1rem; margin-bottom: 10px; color: var(--text-muted); }
        .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .history-item { background: rgba(0,0,0,0.15); padding: 10px 12px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 0.9rem; align-items: center; }
        .btn-full { width: 100%; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🕳️ Creatures Cornhole</h1>
        </header>

        <!-- Scoreboard Card -->
        <div class="card">
            <div class="scoreboard">
                <div class="team-box">
                    <span class="team-name" id="labelTeam1">Team 1</span>
                    <div class="score-display" id="score1">0</div>
                    <div class="controls">
                        <button class="btn-sm btn-sec" onclick="adjustScore(1, -1)">-1</button>
                        <button class="btn-sm" onclick="adjustScore(1, 1)">+1</button>
                    </div>
                </div>
                <div class="vs">VS</div>
                <div class="team-box">
                    <span class="team-name" id="labelTeam2">Team 2</span>
                    <div class="score-display" id="score2">0</div>
                    <div class="controls">
                        <button class="btn-sm btn-sec" onclick="adjustScore(2, -1)">-1</button>
                        <button class="btn-sm" onclick="adjustScore(2, 1)">+1</button>
                    </div>
                </div>
            </div>
            <button class="btn-full btn-danger btn-sm" style="margin-top: 20px;" onclick="resetGame()">Reset Current Game</button>
        </div>

        <!-- Quick Add Points -->
        <div class="card">
            <h2>Quick Scoring Rounds</h2>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <input type="text" id="t1NameInput" placeholder="Team 1 Name" oninput="updateNames()" style="flex:1; padding:8px; border-radius:6px; border:none; background:#334155; color:white;">
                <input type="text" id="t2NameInput" placeholder="Team 2 Name" oninput="updateNames()" style="flex:1; padding:8px; border-radius:6px; border:none; background:#334155; color:white;">
            </div>
            <div class="action-grid">
                <button class="btn-sec" onclick="addPoints(1, 3)">+3 (In Hole) T1</button>
                <button class="btn-sec" onclick="addPoints(2, 3)">+3 (In Hole) T2</button>
                <button class="btn-sec" onclick="addPoints(1, 1)">+1 (On Board) T1</button>
                <button class="btn-sec" onclick="addPoints(2, 1)">+1 (On Board) T2</button>
            </div>
            <button class="btn-full" style="background-color: var(--primary-dark); margin-top: 14px;" onclick="saveMatch()">Finish & Save Match</button>
        </div>

        <!-- Match History -->
        <div class="card history-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h2>Match History</h2>
                <button class="btn-sm btn-sec" onclick="clearHistory()">Clear</button>
            </div>
            <div class="history-list" id="historyList">
                <div style="color: var(--text-muted); text-align:center; font-size:0.85rem; padding:10px;">No saved matches yet</div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            score1: 0,
            score2: 0,
            t1Name: "Team 1",
            t2Name: "Team 2",
            history: []
        };

        function loadData() {
            const saved = localStorage.getItem('creatures_cornhole_state');
            if (saved) {
                try { state = JSON.parse(saved); } catch(e) {}
            }
            render();
        }

        function saveData() {
            localStorage.setItem('creatures_cornhole_state', JSON.stringify(state));
        }

        function adjustScore(team, amount) {
            if (team === 1) state.score1 = Math.max(0, state.score1 + amount);
            if (team === 2) state.score2 = Math.max(0, state.score2 + amount);
            saveData();
            render();
        }

        function addPoints(team, pts) {
            adjustScore(team, pts);
        }

        function updateNames() {
            const t1 = document.getElementById('t1NameInput').value.trim();
            const t2 = document.getElementById('t2NameInput').value.trim();
            state.t1Name = t1 || "Team 1";
            state.t2Name = t2 || "Team 2";
            saveData();
            renderLabels();
        }

        function resetGame() {
            state.score1 = 0;
            state.score2 = 0;
            saveData();
            render();
        }

        function saveMatch() {
            const matchRecord = {
                t1: state.t1Name,
                s1: state.score1,
                t2: state.t2Name,
                s2: state.score2,
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };
            state.history.unshift(matchRecord);
            saveData();
            resetGame();
            render();
        }

        function clearHistory() {
            state.history = [];
            saveData();
            render();
        }

        function renderLabels() {
            document.getElementById('labelTeam1').innerText = state.t1Name;
            document.getElementById('labelTeam2').innerText = state.t2Name;
        }

        function render() {
            document.getElementById('score1').innerText = state.score1;
            document.getElementById('score2').innerText = state.score2;
            renderLabels();

            const listEl = document.getElementById('historyList');
            if (state.history.length === 0) {
                listEl.innerHTML = '<div style="color: var(--text-muted); text-align:center; font-size:0.85rem; padding:10px;">No saved matches yet</div>';
                return;
            }

            let html = '';
            state.history.forEach(m => {
                html += `<div class="history-item">
                    <span><strong>${m.t1}</strong> (${m.s1}) vs <strong>${m.t2}</strong> (${m.s2})</span>
                    <span style="font-size:0.75rem; color:var(--text-muted);">${m.date}</span>
                </div>`;
            });
            listEl.innerHTML = html;
        }

        loadData();
    </script>
</body>
</html>
